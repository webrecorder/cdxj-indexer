[project]
name = "cdxj-indexer"
version = "1.4.6"
description = "CDXJ Indexer for WARC and ARC files"
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Ilya Kreymer", email = "ikreymer@gmail.com" },
]
dependencies = [
    "warcio",
    "surt",
    # temp fix for requests
    "idna<3.0",
    "py3amf",
    "multipart",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/webrecorder/cdxj-indexer"

[project.scripts]
cdxj-indexer = "cdxj_indexer.main:main"

[dependency-groups]
dev = [
    "black",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cdxj_indexer"]

[tool.hatch.build.targets.sdist]
include = [
    "cdxj_indexer",
    "test",
    "README.rst",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["cdxj_indexer", "test"]
addopts = "--doctest-modules"
